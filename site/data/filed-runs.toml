# Runs filed in the Lab against an open cell or a shared case, as the status page lists them.
#
# A row here is a filed run, not a register record: it has no claim results and is not counted
# in the totals above it. `operated_by` says who ran it relative to the code under test;
# `lab_rerun` says what the Lab itself reran, and is "not rerun" when nothing was.
# tools/gen_status.py renders this file; edit it here, then regenerate.

